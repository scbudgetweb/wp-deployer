# Pushing a tag like v0.2.0 builds wp-deployer-0.2.0.zip and publishes it as the latest release.
# Sites running WP Deployer then offer the update in Dashboard › Updates.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the plugin version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(sed -nE 's/^ \* Version: +([^ ]+).*/\1/p' wp-deployer.php)
          CONST=$(sed -nE "s/.*'WPD_VERSION', '([^']+)'.*/\1/p" wp-deployer.php)
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but wp-deployer.php says Version: $HEADER / WPD_VERSION: $CONST"
            exit 1
          fi

      - name: Build zip
        run: git archive --format=zip --prefix=wp-deployer/ -o "wp-deployer-${GITHUB_REF_NAME#v}.zip" "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="wp-deployer-${GITHUB_REF_NAME#v}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
          else
            NOTES=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
            if [ -n "$NOTES" ]; then
              gh release create "$GITHUB_REF_NAME" "$ZIP" --title "WP Deployer ${GITHUB_REF_NAME#v}" --notes "$NOTES" --latest
            else
              gh release create "$GITHUB_REF_NAME" "$ZIP" --title "WP Deployer ${GITHUB_REF_NAME#v}" --generate-notes --latest
            fi
          fi
